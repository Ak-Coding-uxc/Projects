<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Swap Studio</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="page-shell">
      <header class="top-nav glass">
        <div class="logo">◉ <span>FaceSwap</span></div>
        <nav>
          <a href="#">Home</a>
          <a href="#">Features</a>
          <a href="#">Pricing</a>
          <a href="#">FAQ</a>
        </nav>
        <button class="ghost-btn" type="button">Create Account</button>
      </header>

      <section class="hero glass">
        <p class="pill">AI Thumbnail Editor</p>
        <h1>One-click Face Swap for Thumbnails</h1>
        <p class="hero-copy">
          Upload your thumbnail and a portrait. We preserve composition and style while blending the new face naturally.
        </p>

        <form id="swapForm" class="upload-grid">
          <div class="field-card">
            <label for="thumbnail">Thumbnail Image</label>
            <input id="thumbnail" name="thumbnail" type="file" accept="image/png,image/jpeg,image/webp" required />
          </div>

          <div class="field-card">
            <label for="portrait">Portrait / Head Image</label>
            <input id="portrait" name="portrait" type="file" accept="image/png,image/jpeg,image/webp" required />
          </div>

          <div class="field-card full-width">
            <label for="extraInstructions">Extra Instructions</label>
            <textarea
              id="extraInstructions"
              name="extraInstructions"
              rows="4"
              placeholder="Keep original background, match lighting and skin tone, preserve hairstyle..."
            ></textarea>
          </div>

          <div class="cta-row full-width">
            <button id="generateBtn" type="submit" class="primary-btn">Generate</button>
            <span class="hint">JPG, PNG, WEBP · up to 10MB each</span>
          </div>
        </form>

        <section id="statusSection" class="status" aria-live="polite"></section>

        <section id="resultSection" class="result-card hidden">
          <div class="result-header">
            <h2>Generated Result</h2>
            <a id="downloadBtn" class="download-btn" download="face-swap-result.png">Download Image</a>
          </div>
          <img id="resultImage" alt="Generated face swap result" />
        </section>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
